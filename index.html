<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Loja Impala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Indicador exibido só nos primeiros instantes, antes de sabermos
       se o catálogo está ativo ou pausado -->
  <div id="carregando-app" class="carregando-app">
    <span class="spinner"></span>
  </div>

  <!-- ===================================================== -->
  <!-- TELA DE CATÁLOGO PAUSADO (assinatura em atraso) -->
  <!-- ===================================================== -->
  <section id="tela-pausado" class="tela tela-pausado" hidden>
    <div class="pausado-conteudo">
      <span class="pausado-icone">⏸️</span>
      <h1>Catálogo temporariamente pausado</h1>
      <p>Este catálogo está com o acesso pausado no momento. Entre em contato pra regularizar e voltar a usar normalmente.</p>
      <a id="btn-pausado-whatsapp" class="btn-pausado-whatsapp" href="#" target="_blank" rel="noopener">
        Falar no WhatsApp
      </a>
    </div>
  </section>

  <!-- ===================================================== -->
  <!-- TELA 1 — INICIAL: cabeçalho + cards de coleção -->
  <!-- ===================================================== -->
  <section id="tela-inicial" class="tela" hidden>
    <header class="app-header">
      <img id="vendedor-foto" class="vendedor-foto" src="" alt="Foto do vendedor" />
      <div class="header-texto">
        <h1 id="nome-catalogo">Loja Impala</h1>
        <p id="vendedor-nome">Carregando...</p>
        <p id="vendedor-slogan" class="vendedor-slogan"></p>
      </div>
    </header>

    <p id="status-msg" class="status-msg" hidden></p>

    <main id="grade-colecoes" class="grade-colecoes" aria-live="polite">
      <!-- cards de coleção inseridos aqui via JS -->
    </main>

    <p id="slogan-marca" class="slogan-marca"></p>

    <div class="cta-catalogo">
      <p>Quer seu próprio catálogo? Entre em contato</p>
      <a id="btn-solicitar-catalogo" class="btn-solicitar-catalogo" href="#" target="_blank" rel="noopener">
        Solicitar Catálogo
      </a>
    </div>
  </section>

  <!-- ===================================================== -->
  <!-- TELA 2 — PRODUTOS DA COLEÇÃO -->
  <!-- ===================================================== -->
  <section id="tela-colecao" class="tela" hidden>
    <header class="header-secundario">
      <button id="btn-voltar-colecao" class="btn-voltar" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h2 id="titulo-colecao">Coleção</h2>
    </header>

    <main id="grade-produtos" class="grade-produtos" aria-live="polite">
      <!-- cards de produto inseridos aqui via JS -->
    </main>
  </section>

  <!-- ===================================================== -->
  <!-- TELA 3 — CARRINHO -->
  <!-- ===================================================== -->
  <section id="tela-carrinho" class="tela" hidden>
    <header class="header-secundario">
      <button id="btn-voltar-carrinho" class="btn-voltar" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <h2>Seu pedido</h2>
      <button id="btn-limpar-carrinho" class="btn-limpar-carrinho" aria-label="Excluir todos os itens">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
        <span>Excluir tudo</span>
      </button>
    </header>

    <div class="carrinho-loja">
      <label for="input-loja">Nome da loja (opcional)</label>
      <input id="input-loja" type="text" placeholder="Ex: Loja 1, CNPJ, ou deixe em branco" />
    </div>

    <div id="lista-carrinho" class="lista-carrinho">
      <!-- itens do carrinho aparecem aqui -->
    </div>

    <div class="carrinho-rodape">
      <div class="carrinho-total">
        <span>Total</span>
        <strong id="carrinho-total-valor">R$ 0,00</strong>
      </div>
      <button id="btn-enviar-pedido" class="btn-enviar-pedido">
        Enviar pedido pelo WhatsApp
      </button>
    </div>
  </section>

  <!-- ===== BOTÃO FLUTUANTE DO CARRINHO (visível nas telas 1 e 2) ===== -->
  <button id="btn-carrinho" class="btn-carrinho" aria-label="Abrir carrinho">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <span id="carrinho-contagem">0</span>
  </button>

  <!-- Supabase JS via CDN (usado apenas se as credenciais forem configuradas em config.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="plataforma.js"></script>
  <script src="config.js"></script>
  <script src="data/mock-products.js"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
